<script>
const CONFIG = {
  URL: "https://opensheet.elk.sh/1UXItiDpajKD1vMZhFhTuCNBaXoZ5sSCtm9ZQRP9E1H8/Sheet1",
  FIELDS: {
    nama:    ["nama","namalengkap","name"],
    jabatan: ["jabatan","posisi","role"],
    divisi:  ["divisi","division","bidang"],
    tahun:   ["tahunabdi","tahun","angkatan"],
    poin:    ["totalakumulasipoint","poin","point","totalpoin","skor"],
    foto:    ["foto","photo","gambar","image","linkfoto"]
  },
  YEAR_THEMES: [
    { test: /2/i, cls: "t2" },
    { test: /1/i, cls: "t1" }
  ],
  TABLE_START: 4
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
const fmt = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 1 });

function pick(row, aliases){
  const keys = Object.keys(row);
  for (const a of aliases){
    const k = keys.find(k => norm(k) === a);
    if (k !== undefined) return String(row[k] ?? "").trim();
  }
  return "";
}
function themeOf(t){ const m = CONFIG.YEAR_THEMES.find(m => m.test.test(t)); return m ? m.cls : ""; }
function initials(n){ return n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("") || "?"; }

function toNum(s){
  let v = String(s).trim().replace(/[^\d.,-]/g, "");
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(v)) v = v.replace(/[.,]/g, "");
  else v = v.replace(",", ".");
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

let ranked = [];

async function load(){
  $("podium").innerHTML = '<div class="skel first"></div><div class="skel"></div><div class="skel"></div>';
  $("rest").hidden = true;
  try{
    const res = await fetch(CONFIG.URL, {cache:"no-cache"});
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error("format");
    const list = rows.map(r => {
      const o = {};
      for (const f in CONFIG.FIELDS) o[f] = pick(r, CONFIG.FIELDS[f]);
      
      const totalPoin = toNum(o.poin);
      const tahunAbdi = Math.max(1, toNum(o.tahun)); // Minimal 1 tahun agar tidak membagi dengan nol
      
      // LOGIKA BARU: Poin dihitung rata-rata per tahun abdi
      o.score = totalPoin / tahunAbdi;
      o.rawPoin = totalPoin;
      return o;
    }).filter(p => p.nama);

    // Pengurutan berdasarkan skor per tahun tertinggi
    list.sort((a, b) => b.score - a.score || a.nama.localeCompare(b.nama, "id"));
    list.forEach((p, i) => { p.rank = i && p.score === list[i-1].score ? list[i-1].rank : i + 1; });
    ranked = list;
    render();
  }catch(e){
    $("count").textContent = "";
    $("podium").innerHTML = '<div class="state" style="grid-column:1/-1">Data belum bisa dimuat. Periksa koneksi internet, lalu coba lagi.<br><button id="retry">Muat ulang</button></div>';
    $("retry").onclick = load;
  }
}

function avatar(p){
  const img = p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  return `<span class="ava">${img || esc(initials(p.nama))}</span>`;
}

function render(){
  $("count").innerHTML = `<b>${ranked.length}</b> anggota`;
  if (!ranked.length){
    $("podium").innerHTML = '<div class="state" style="grid-column:1/-1">Belum ada data peringkat.</div>';
    return;
  }
  const names = ["first","second","third"];
  $("podium").innerHTML = ranked.slice(0, 3).map((p, i) => `
    <article class="pc ${names[i]} ${themeOf(p.tahun)}">
      <div class="p-top"><span class="p-div">${esc(p.divisi)}</span>${avatar(p)}</div>
      <div class="rank" aria-label="Peringkat ${p.rank}">${p.rank}</div>
      <div>
        <div class="p-name">${esc(p.nama)}</div>
        <div class="p-foot"><span class="p-role">${esc(p.jabatan)}</span><span class="pts">${fmt(p.score)} pts/thn</span></div>
      </div>
    </article>`).join("");

  const hasRest = ranked.length >= CONFIG.TABLE_START;
  $("rest").hidden = !hasRest;
  if (hasRest) renderTable();
}

function renderTable(){
  const q = norm($("q").value);
  const rows = ranked.filter((p, i) => i + 1 >= CONFIG.TABLE_START && (!q || norm(p.nama).includes(q)));
  $("table").innerHTML = rows.length ? rows.map(p => `
    <div class="row">
      <span class="r-n">${p.rank}</span>
      <div>
        <div class="r-name"><i class="dot ${themeOf(p.tahun)}"></i><span>${esc(p.nama)}</span></div>
        <div class="r-sub">${esc([p.jabatan, p.divisi].filter(Boolean).join(", "))}</div>
      </div>
      <span class="r-pts">${fmt(p.score)} pts/thn</span>
    </div>`).join("") : '<div class="state">Nama tidak ditemukan.</div>';
}
$("q").addEventListener("input", renderTable);

load();
</script>
